<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}FlyFlask Airlines{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="header">
        <a href="{{ url_for('home') }}" class="logo">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21 4 19 4c-2 0-4.6.5-6.1 1.4L9 7 4.8 5.4C4 5.2 3 5.4 2.5 6l-.5.5 4.8 4.8L4 13H2l-1 2 3 1 1 3 2-1v-2l1.8-2.8L13 18.8c1 .5 2 .8 3 .8s2-.3 2.8-.8l-1-2.6z"/>
            </svg>
            Fly<span>Flask</span>
        </a>
        <nav class="nav">
            <a href="{{ url_for('destinations.index') }}">Destinos</a>
            <a href="{{ url_for('blog.index') }}">Blog</a>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('profile') }}">Mi Perfil</a>
                <a href="{{ url_for('s3_service.index') }}">Galeria</a>
                {% if is_admin %}
                    <a href="{{ url_for('admin_dashboard') }}" class="nav-admin">Admin</a>
                {% endif %}
                <a href="{{ url_for('logout') }}">Salir</a>
            {% else %}
                <a href="{{ url_for('auth.login') }}" class="nav-cta">Ingresar</a>
            {% endif %}
        </nav>
    </header>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2025 FlyFlask Airlines &mdash; Todos los derechos reservados.</p>
    </footer>

    <!-- Initialize Lucide icons -->
    <script>lucide.createIcons();</script>

    <!-- Intersection Observer for scroll animations -->
    <script>
    (function() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.12 });

        document.querySelectorAll('.animate').forEach(el => observer.observe(el));
    })();
    </script>
</body>
</html>
