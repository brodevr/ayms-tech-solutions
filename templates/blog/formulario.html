{% extends 'base.html' %}
{% block title %}{{ action }} - FlyFlask{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <div class="form-card-header">
            <h1>{{ action }}</h1>
            <p>Escribe un articulo para inspirar a otros viajeros.</p>
        </div>

        <form method="POST" class="admin-form">
            <div class="form-group">
                <label for="title">Titulo del articulo *</label>
                <input type="text" id="title" name="title" value="{{ post.title if post else '' }}" required placeholder="Ej: 10 razones para visitar Tokio">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="destination_id">Destino relacionado (opcional)</label>
                    <select id="destination_id" name="destination_id">
                        <option value="">-- Sin destino --</option>
                        {% for dest in destinations %}
                        <option value="{{ dest.id }}" {% if post and post.destination_id == dest.id %}selected{% endif %}>
                            {{ dest.emoji }} {{ dest.name }}, {{ dest.country }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="image_url">URL de imagen de portada</label>
                    <input type="url" id="image_url" name="image_url" value="{{ post.image_url if post else '' }}" placeholder="https://...">
                </div>
            </div>

            <div class="form-group">
                <label for="content">Contenido del articulo *</label>
                <textarea id="content" name="content" rows="14" required placeholder="Escribe el articulo aqui. Cada linea en blanco sera un nuevo parrafo.">{{ post.content if post else '' }}</textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">{{ action }}</button>
                <a href="{{ url_for('blog.index') }}" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
